<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts</title>
<link rel="icon" type="image/png" href="https://images.stockcake.com/public/5/b/8/5b80b248-5a77-4bbf-b439-1ee43b47ed6e_medium/synthwave-los-angeles-stockcake.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="script.js" defer></script>
</head>
<body class="bg-[#212121] text-[#f5f5f5] font-sans p-6">
<div class="max-w-[1872px] mx-auto grid gap-6 lg:grid-cols-[290px_1fr_350px]">

  <div class="bg-black/10 rounded-2xl h-20 p-2 flex items-center gap-4">
    <img class="w-16 h-16 rounded-full" src="images/avatar.png"/>
    <b class="text-xl">Aydar Khantimirov</b>
  </div>

  <input type="search" placeholder="Search songs" class="bg-black/50 rounded-2xl h-20 px-5 text-xl font-bold placeholder-white lg:col-span-2 w-full">

  <nav class="space-y-5 lg:mt-20">
    <a href="index.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Home</a>
    <a href="playlists.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Playlists</a>
    <a href="favorites.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Favorites</a>
    <a href="charts.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-white">Charts</a>
  </nav>

  <main class="space-y-10 lg:mt-20">
<section class="bg-black/20 rounded-2xl p-5">
  <h2 class="text-3xl font-bold mb-3">Genre Charts</h2>
  <div class="flex flex-wrap gap-5">
    <a href="chart.html" class="text-center">
      <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/cat_1.jfif"/>
      <p class="mt-1">Pop</p>
    </a>
    <a href="chart.html" class="text-center">
      <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/dog_2.jfif"/>
       <p class="mt-1">Hip-hop</p>
    </a>
    <a href="chart.html" class="text-center">
      <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/dog_1.jpg"/>
      <p class="mt-1">Rock</p>
    </a>
    <a href="chart.html" class="text-center">
      <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/monke_1.jfif"/>
      <p class="mt-1">Country</p>
    </a>
    <a href="chart.html" class="text-center">
      <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/cat_2.jfif"/>
      <p class="mt-1">Alternative</p>
    </a>
  </div>
</section>
<section class="bg-black/20 rounded-2xl p-5">
  <h2 class="text-3xl font-bold mb-3">Regional Charts</h2>
  <div class="flex flex-wrap gap-5"><a href="chart.html" class="text-center">
    <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/region_ww.jpg"/>
    <p class="mt-1">Worldwide</p>
  </a>
  <a href="chart.html" class="text-center">
    <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/region_us.jpg"/>
    <p class="mt-1">United States</p>
  </a>
  <a href="chart.html" class="text-center">
    <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/region_uk.png"/>
    <p class="mt-1">United Kingdom</p>
  </a>
  <a href="chart.html" class="text-center">
    <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/region_in.jpg"/>
    <p class="mt-1">India</p>
  </a>
  <a href="chart.html" class="text-center">
    <img class=" rounded-2xl  w-[192px] h-[192px]" src="images/region_ru.jpg"/>
    <p class="mt-1">Russia</p>
  </a>
</div>
</section>
  </main>

  <aside class="lg:mt-20">
    <h2 class="text-3xl mb-3">Now Playing</h2>
    <img class="rounded-2xl w-full aspect-square flex" src="images/cover_hitmehardandsoft.jpg" id="pulsingImage" onclick="togglePulse()"/>
    <p id="title" class="text-2xl mt-3">Pick a song</p>
    <audio id="player" controls class="w-full mt-3"></audio>
  </aside>
</div>
</body></html>
