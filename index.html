<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonoteka - Home</title>
<link rel="icon" type="image/png" href="https://images.stockcake.com/public/5/b/8/5b80b248-5a77-4bbf-b439-1ee43b47ed6e_medium/synthwave-los-angeles-stockcake.jpg">
<link href="style.css" rel="stylesheet" type="text/css"/>
<script src="script.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#212121] text-[#f5f5f5] font-sans p-6">
<div class="max-w-[1872px] mx-auto grid gap-6 lg:grid-cols-[290px_1fr_350px]">

  <div class="bg-black/10 rounded-2xl h-20 p-2 flex items-center gap-4">
    <img class="w-16 h-16 rounded-full" src="images/avatar.png"/>
    <b class="text-xl">Aydar Khantimirov</b>
  </div>

  <input type="search" placeholder="Search songs" class="bg-black/50 rounded-2xl h-20 px-5 text-xl font-bold placeholder-white lg:col-span-2 w-full">

  <nav class="space-y-5 lg:mt-20">
    <a href="index.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-white">Home</a>
    <a href="playlists.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Playlists</a>
    <a href="favorites.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Favorites</a>
    <a href="charts.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Charts</a>
  </nav>

  <main id="main-element-animated" class="space-y-10 lg:mt-20 opacity-20 translate-y-5 transition-all duration-500 ease-in" onload="mainAnimation()">
<section class="bg-black/20 rounded-2xl p-5">
  <h2 class="text-3xl font-bold mb-3">Quick Pick</h2>
  <div class="flex flex-wrap gap-5">
    <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="https://upload.wikimedia.org/wikipedia/en/a/aa/Billie_Eilish_-_Hit_Me_Hard_and_Soft.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled"/>
    <p class="mt-1">CHIHIRO</p>
  </a>
  <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="https://thumb.wikimedia.org/wikipedia/en/thumb/c/c1/Beerbongs_%26_Bentleys_by_Post_Malone.png/250px-Beerbongs_%26_Bentleys_by_Post_Malone.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"/>
    <p class="mt-1">Rockstar</p>
  </a>
  <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="images/cover_Chemical.png"/>
    <p class="mt-1">Chemical</p>
  </a>
  <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="images/cover_lovemenot.jfif"/>
    <p class="mt-1">Love Me Not</p>
  </a>
  <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="images/cover_yonaguni.jpg"/>
    <p class="mt-1">Yonaguni</p>
  </a>
  <a href="album.html" class="text-center">
    <img class="rounded-2xl w-[164px] h-[164px]" src="images/cover_f1trillion.jfif"/>
    <p class="mt-1">Finer Things</p>
  </a>
</div>
</section>
<section class="bg-black/20 rounded-2xl p-5">
  <h2 class="text-3xl font-bold mb-3">Stations</h2>
  <div class="flex flex-wrap gap-5">
    <a href="index.html" class="text-center">
      <img class="rounded-2xl w-[256px] h-[256px]" src="images/cat_1.jfif"/>
      <p class="mt-1">Your Station</p>
    </a>
    <a href="index.html" class="text-center">
      <img class="rounded-2xl w-[256px] h-[256px]" src="images/dog_2.jfif"/>
      <p class="mt-1">Discover New</p>
    </a>
    <a href="index.html" class="text-center">
      <img class="rounded-2xl w-[256px] h-[256px]" src="images/dog_1.jpg"/>
       <p class="mt-1">Recently Played</p>
    </a>
    <a href="index.html" class="text-center">
      <img class="rounded-2xl w-[256px] h-[256px]" src="images/monke_1.jfif"/>
       <p class="mt-1">Radio One</p>
    </a>
  </div>
  </section>
  </main>

  <aside class="lg:mt-20">
    <h2 class="text-3xl mb-3">Now Playing</h2>
    <img class="rounded-2xl w-full aspect-square flex" src="https://upload.wikimedia.org/wikipedia/en/a/aa/Billie_Eilish_-_Hit_Me_Hard_and_Soft.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled" id="pulsingImage" onclick="togglePulse()"/>
    <p id="title" class="text-2xl mt-3">Pick a song</p>
    <audio id="player" controls class="w-full mt-3"></audio>
  </aside>
</div>
</body></html>
