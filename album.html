<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIT ME HARD AND SOFT</title>
<link rel="icon" type="image/png" href="https://images.stockcake.com/public/5/b/8/5b80b248-5a77-4bbf-b439-1ee43b47ed6e_medium/synthwave-los-angeles-stockcake.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="script.js" defer></script>
</head>
<body class="bg-[#212121] text-[#f5f5f5] font-sans p-6">
<div class="max-w-[1872px] mx-auto grid gap-6 lg:grid-cols-[290px_1fr_350px]">

  <div class="bg-black/10 rounded-2xl h-20 p-2 flex items-center gap-4">

  <input type="search" placeholder="Search songs" class="bg-black/50 rounded-2xl h-20 px-5 text-xl font-bold placeholder-white lg:col-span-2 w-full">

  <nav class="space-y-5 lg:mt-20">
    <a href="index.html" class="block bg-black/50 rounded-2xl h-20 leading-[80px] px-3 text-xl font-bold border-2 border-transparent">Home</a>

  <main class="space-y-10 lg:mt-20">
<a href="favorites.html" class="text-3xl font-bold block mb-4">&larr; Back</a>
<section class="bg-black/20 rounded-2xl p-5">

    <li><a href="#" onclick="play('music/song2.m4a','LUNCH');return false" class="block hover:bg-white/10 rounded px-2 py-1">LUNCH</a></li>
